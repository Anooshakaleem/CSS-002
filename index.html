<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Perfume Product Card </title>
     <link rel="stylesheet" href="style.css">  
    <href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="card"> 
        <span class="discount">20% off</span>
        <div class="image-box">
            <img src="./image/perfume.png" alt=" Luxury perfume"></div> 
            
        <div class="content">
            <div class="item"> <P> LUXURY PERFUME</P>
            <h2> Rose Elegent</h2>
            <p class="details">
                A beautiful fragrance that makes every moment special
             </p>
             <div class="price">
                <h3>$50.00</h3>
                <del>$58.00</del>
             </div>
             
             <p class="label">COLOR</p>
             <div class="color-box">
                <div class="c active-color" id="c1" onclick="changeColor(this)"></div>
                <div class="c" id="c2" onclick="changeColor(this)"></div>
                <div class="c" id="c3" onclick="changeColor(this)"></div>
             </div>
             <div class="btn">
                <button class="buy-btn">Buy Now →</button>
                <button class="cart-btn"><i class="fa-solid fa-cart-shopping"></i>Add to Cart"</button>
             </div>

             </div>

        </div>
               
           


        </div>
    </div>
</body>
</html>
